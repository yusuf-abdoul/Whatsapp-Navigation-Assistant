{# One anchor card. The form posts parallel arrays (anchor_name[], anchor_lat[], etc.). #}
<div class="anchor-row rounded-md border border-slate-200 bg-white p-4">
  <div class="flex items-start justify-between">
    <span class="text-xs font-medium uppercase tracking-wide text-slate-500">Anchor</span>
    <button type="button"
            onclick="this.closest('.anchor-row').remove()"
            class="text-xs text-slate-400 hover:text-rose-600">remove</button>
  </div>

  <div class="mt-3 grid sm:grid-cols-2 gap-4">
    <label class="block">
      <span class="text-sm font-medium text-slate-700">Name</span>
      <input name="anchor_name" type="text" required value="{{ row.name }}"
             placeholder="e.g. Police Signpost"
             class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500" />
    </label>

    <label class="block">
      <span class="text-sm font-medium text-slate-700">Aliases <span class="text-slate-400 font-normal">(optional)</span></span>
      <input name="anchor_aliases" type="text" value="{{ row.aliases }}"
             placeholder="comma-separated, e.g. banex, banex plaza"
             class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500" />
    </label>

    <label class="block">
      <span class="text-sm font-medium text-slate-700">Latitude</span>
      <input name="anchor_lat" type="text" inputmode="decimal" required value="{{ row.lat }}"
             placeholder="9.0750"
             class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500" />
    </label>

    <label class="block">
      <span class="text-sm font-medium text-slate-700">Longitude</span>
      <input name="anchor_lon" type="text" inputmode="decimal" required value="{{ row.lon }}"
             placeholder="7.4820"
             class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500" />
    </label>
  </div>
</div>
