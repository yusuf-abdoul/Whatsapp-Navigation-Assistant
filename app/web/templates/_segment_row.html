{# One segment card. Parallel form arrays — seg_from[], seg_to[], seg_mode[], etc. #}
<div class="segment-row rounded-md border border-slate-200 bg-white p-4">
  <div class="flex items-start justify-between">
    <span class="text-xs font-medium uppercase tracking-wide text-slate-500">Step</span>
    <button type="button"
            onclick="this.closest('.segment-row').remove()"
            class="text-xs text-slate-400 hover:text-rose-600">remove</button>
  </div>

  <div class="mt-3 grid sm:grid-cols-2 gap-4">
    <label class="block">
      <span class="text-sm font-medium text-slate-700">From anchor</span>
      <input name="seg_from" type="text" required value="{{ row.from_anchor }}"
             placeholder="must match an anchor name above"
             class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500" />
    </label>

    <label class="block">
      <span class="text-sm font-medium text-slate-700">To anchor</span>
      <input name="seg_to" type="text" required value="{{ row.to_anchor }}"
             placeholder="must match an anchor name above"
             class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500" />
    </label>

    <label class="block">
      <span class="text-sm font-medium text-slate-700">Transport mode</span>
      <select name="seg_mode"
              class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500">
        {% for m in modes %}
          <option value="{{ m }}" {% if m == row.mode %}selected{% endif %}>{{ m }}</option>
        {% endfor %}
      </select>
    </label>

    <label class="block">
      <span class="text-sm font-medium text-slate-700">Vehicle change at this step?</span>
      <select name="seg_transfer"
              class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500">
        <option value="false" {% if row.transfer != 'true' %}selected{% endif %}>No — continue same vehicle</option>
        <option value="true" {% if row.transfer == 'true' %}selected{% endif %}>Yes — passenger changes vehicle here</option>
      </select>
    </label>

    <label class="block sm:col-span-2">
      <span class="text-sm font-medium text-slate-700">Instruction</span>
      <input name="seg_instruction" type="text" required value="{{ row.instruction }}"
             placeholder='e.g. "Take a taxi to Berger junction."'
             class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500" />
      <span class="mt-1 block text-xs text-slate-500">
        Write as a fresh boarding directive. The renderer will collapse same-mode steps automatically.
      </span>
    </label>

    <label class="block sm:col-span-2">
      <span class="text-sm font-medium text-slate-700">
        Passes through <span class="text-slate-400 font-normal">(optional)</span>
      </span>
      <input name="seg_passthroughs" type="text" value="{{ row.passthroughs }}"
             placeholder="comma-separated anchor names this vehicle stops or could pick up at, e.g. Federal Housing, Shoprite"
             class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500" />
      <span class="mt-1 block text-xs text-slate-500">
        Each name must also appear in your Anchors list above. Lets riders boarding at these
        spots match this same step.
      </span>
    </label>

    <label class="block">
      <span class="text-sm font-medium text-slate-700">Cost <span class="text-slate-400 font-normal">(optional, ₦)</span></span>
      <input name="seg_cost_ngn" type="number" min="0" value="{{ row.cost_ngn }}"
             placeholder="200"
             class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500" />
    </label>

    <label class="block">
      <span class="text-sm font-medium text-slate-700">Duration <span class="text-slate-400 font-normal">(optional, minutes)</span></span>
      <input name="seg_duration_min" type="number" min="0" value="{{ row.duration_min }}"
             placeholder="10"
             class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500" />
    </label>
  </div>
</div>
