services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wna
      POSTGRES_PASSWORD: wna_dev
      POSTGRES_DB: wna
    ports:
      - "5432:5432"
    volumes:
      - wna_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wna -d wna"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  wna_pg:
