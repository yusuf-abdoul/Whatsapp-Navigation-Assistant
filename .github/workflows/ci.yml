name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wna
          POSTGRES_PASSWORD: wna_dev
          POSTGRES_DB: wna
        ports: ["5432:5432"]
        # tests/conftest.py creates wna_test on first run; we just need
        # Postgres reachable before the test step starts.
        options: >-
          --health-cmd "pg_isready -U wna"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-extras --frozen
      - run: uv run python --version && uv run mypy --version && uv run ruff --version
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest -q
