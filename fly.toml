# fly.toml app configuration file generated for wna-api on 2026-06-04T14:17:50+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'wna-api'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  release_command = 'alembic upgrade head'

[env]
  CHANNEL_PROVIDER = 'twilio'
  ENV = 'production'
  IDENTICAL_QUERY_COOLDOWN_SECONDS = '5'
  LOG_LEVEL = 'INFO'
  RATE_LIMIT_PER_DAY = '100'
  RATE_LIMIT_PER_HOUR = '30'
  SESSION_TTL_SECONDS = '600'
  WEB_SESSION_MAX_AGE_SECONDS = '1209600'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
